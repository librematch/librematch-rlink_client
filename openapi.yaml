  /game/item/signItems:
    post:
      tags:
      - Game
      summary: Signs an item list
      description: |
        Signs the `crc` the client computed over the item list with the service's
        signing key (crc32 → SHA-512 → the RelicLink PKCS#1 v1.5 variant, the same
        344-char signature family) and answers `[0, "<signature>"]`; a refused request
        answers `[2, ""]`.
      operationId: gameSignItems
      x-games:
      - A1
      - A2
      - A3
      - A4
      - AoM
      x-response-positions:
      - name: resultCode
        description: |
          0 on success; 2 when the signature is refused.
        value: 0
      - name: signature
        description: the 344-char signature; "" on refusal.
      security:
      - GameSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - itemIDs
              properties:
                itemIDs:
                  type: string
                  description: the raw value is signed verbatim (crc32 of the string).
            examples:
              lanRequest:
                summary: Example request
                value:
                  itemIDs: '[74000001]'
      responses:
        '200':
          description: Positional JSON array; the slot order is in the operation's
            `x-response-positions`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Positional'
              examples:
                sample:
                  summary: Example answer
                  value:
                  - 0
                  - 1
        '401':
          $ref: '#/components/responses/Unauthorized'
