  /game/party/reportMatch:
    post:
      tags:
      - Game
      summary: Reports the result of a match
      description: |
        Persists the match and every player row, updates ratings (Elo for the ranked
        ladders, the hidden MMR for the queues), the win/loss/streak counters and the
        challenge progress from the client-update blobs, then answers 16 slots.

        `countersZip` is a JSON string wrapping base64(gzip(JSON array of per-player
        counter-object strings)), with one entry per profile: an unparsable value
        empties the counters and the match is still stored; an empty value keeps
        whatever the first reporter stored. `itemUpdates` is a JSON array of
        per-player JSON strings whose keys (itemUpdates / challengeUpdates /
        eventChallengeUpdates / clientUpdates) default to `[]`/`{}`. `simplayerIDs` is
        int64 because AoE III sends 4294967295 for "no sim player".
      operationId: gamePartyReportMatch
      x-games:
      - A1
      - A2
      - A3
      - A4
      - AoM
      x-response-positions:
      - name: resultCode
        description: 0 on success; 2 on a binding failure, match 0, no profiles, a
          missing store store or a persistence failure (the array keeps its shape
          with empty blocks).
        value: 0
      - name: results
        description: |
          `[]` — the captures carry no results.
        value: []
      - name: replayDescriptor0
        row: ReplayDescriptorRow
        description: the kind-0 replay upload descriptor (or the empty row when the
          title does not upload).
      - name: replayDescriptor1
        row: ReplayDescriptorRow
        description: |
          the kind-1 replay descriptor (A4); the empty row for the other titles.
      - name: extra
        description: |
          null.
      - name: items
        description: |
          `[]`.
        value: []
      - name: challenges
        description: |
          `[]` in every capture.
        value: []
      - name: eventChallenges
        row: ChallengeProgressRow
        description: |
          the event-challenge rows of an A4 report; `[]` when it carries none.
      - name: clientUpdates
        description: |
          the client updates of an A4 rated report (`[[profileID, id, 1, 0, ts, ts,
          ts]]`), `[]` otherwise.
      - name: slots
        value: []
      - name: extra2
        value: []
      - name: zero
        description: |
          constant 0.
        value: 0
      - name: extra3
        description: |
          null.
      - name: counters
        description: |
          the per-profile counter rows of an A4 report (`[["<profileID>", 0]]`),
          `[]` otherwise.
      - name: members
        description: |
          `[]`.
        value: []
      - name: replayUploads
        description: |
          the replay uploads of an A4 rated report (`[["<profileID>", 0]]`), `[]`
          otherwise.
      security:
      - GameSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - match_id
              - profile_ids
              - results
              properties:
                match_id:
                  type: integer
                  format: int64
                profile_ids:
                  type: string
                  description: JSON array of profile ids.
                results:
                  type: string
                  description: 'JSON array of result codes: 1 win, 0 loss, 3 draw/incomplete.'
                teamIDs:
                  type: string
                  description: JSON array, index-aligned; missing defaults 0.
                race_ids:
                  type: string
                  description: JSON array, index-aligned.
                xpGained:
                  type: string
                  description: JSON array, index-aligned.
                countersZip:
                  type: string
                  description: base64(gzip(JSON array of per-player counter blobs)); "" keeps stored.
                itemUpdates:
                  type: string
                  description: JSON array of per-player update JSON strings.
                challengeUpdates:
                  type: string
                  description: alternative carrier of the same block, accepted.
                eventChallengeUpdates:
                  type: string
                  description: alternative carrier, accepted.
                clientUpdates:
                  type: string
                  description: alternative carrier, accepted.
                simplayerIDs:
                  type: string
                  description: JSON array of int64 (AoE III sends 4294967295); logged
                    only.
                checkSums:
                  type: string
                  description: JSON array of int32; logged only.
                lastCallTime:
                  type: integer
                  description: logged only.
            examples:
              lanRequest:
                summary: Example request
                value:
                  match_id: 1
                  profile_ids: example
                  results: example
                  teamIDs: example
                  race_ids: example
                  xpGained: example
                  countersZip: example
                  itemUpdates: example
                  challengeUpdates: example
                  eventChallengeUpdates: example
                  clientUpdates: example
                  simplayerIDs: example
                  checkSums: example
                  lastCallTime: 1
      responses:
        '200':
          description: Positional JSON array; the slot order is in the operation's
            `x-response-positions`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Positional'
              examples:
                sample:
                  summary: Example answer
                  value:
                  - 0
