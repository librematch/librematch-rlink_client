                itemIDs:
                  type: string
                  description: JSON array of item ids.
                itemLocations:
                  type: string
                  description: JSON array; -1 keeps.
                itemCharges:
                  type: string
                  description: JSON array; -1 keeps, else the new durability.
            examples:
              lanRequest:
                summary: Example request
                value:
                  itemIDs: '[74000001]'
