  /game/party/createOrReportSinglePlayer:
    post:
      tags:
      - Game
      summary: Creates or reports a single-player match
      description: |
        With `createMatchKey=1` a pending match is created and a `matchKey` returned;
        with 0 the stored pending match of `matchKey` is reported through the same
        pipeline as reportMatch (single-player queues are unrated) and, with
        `isComplete=1`, issued replay descriptors for both kinds (the single-player
        path `S_<matchID>_<sha>.gz`, uploader slot 1).
      operationId: gamePartyCreateOrReportSinglePlayer
      x-games:
      - A4
      - AoM
      x-response-positions:
      - name: resultCode
        description: 0 on success; 2 on a binding error, a missing match history store,
          a persistence failure or an unknown matchKey.
        value: 0
      - name: matchID
        description: fresh id on create (unix-microseconds masked); 0 on report (officially
          0 too).
      - name: matchKey
        description: 32-hex on create; null on report.
      - name: profileInfo
        row: GameProfileRow
        description: the session user's row.
      - name: leaderboardStats
        description: |
          the 19-slot ladder row of the single player, `[]` when the queue has no
          ladder.
      - name: extra
        value: []
      - name: extra2
        value: []
      - name: extra3
        description: null (officially null).
      - name: zero
        value: 0
      - name: progress
        description: |
          the award-progress counter of an A4 report, 0 when it carries none.
        value: 0
      - name: extra4
        value: []
      - name: challenges
        description: |
          the 12-slot challenge rows an A4 create answer carries; `[]` when it has
          none.
      - name: replayMarkers
        description: null on create and on a report without replays; "" when the descriptors
          exist (officially the same).
      - name: replayDescriptor0
        row: ReplayDescriptorRow
        description: single-player kind-0 descriptor with uploader slot 1.
      - name: replayDescriptor1
        row: ReplayDescriptorRow
        description: kind-1 descriptor.
      - name: clientUpdates
        description: |
          the per-player rows of the A4 reports that carry them, `[]` otherwise.
      - name: extra5
        value: []
      - name: extra6
        value: []
      - name: extra7
        value: []
      - name: extra8
        value: []
      - name: replayUploads
        description: |
          the replay uploads of some A4 reports (`[["<profileID>",0]]`), `[]` otherwise.
      - name: extra9
        value: []
      security:
      - GameSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                createMatchKey:
                  type: integer
                  description: 1 create / 0 report.
                matchKey:
                  type: string
                  description: the 32-hex key to report.
                matchTypeID:
                  type: integer
                  description: scenario id (A4 55/873; AoM 61-69).
                mapname:
                  type: string
                appbincrc:
                  type: integer
                  format: int64
                  description: may be negative.
                datacrc:
                  type: integer
                  format: int64
                moddllcrc:
                  type: integer
                  format: int64
                moddllfile:
                  type: string
                modname:
                  type: string
                modversion:
                  type: string
                options:
                  type: string
                  description: opaque base64+zlib block.
                slotInfo:
                  type: string
                  description: opaque base64+zlib block.
                versionFlags:
                  type: integer
                isComplete:
                  type: integer
                  description: 1 = report with replay descriptors.
                countersZip:
                  type: string
                  description: same form as reportMatch.
                itemUpdates:
                  type: string
                results:
                  type: string
                  description: JSON array; only player 0 (the session user) is scored.
                teamIDs:
                  type: string
                race_ids:
                  type: string
                xpGained:
                  type: string
            examples:
              lanRequest:
                summary: Example request
