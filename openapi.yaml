openapi: 3.0.4
info:
  title: World's Edge API
  version: "2026.11.21"
  description: |
    OpenAPI specification of the official Age of Empires online services: the game
    client API (`/game`) and the public API (`/community`) of the game hosts.

    This document covers only the endpoints the official service exposes: every
    operation here was either captured from the official clients or described in
    a public source.

    ## Titles

    Every operation declares in `x-games` the titles it is registered for: `A1`
    Age of Empires DE, `A2` Age of Empires II DE, `A3` Age of Empires III DE,
    `A4` Age of Empires IV and `AoM` Age of Mythology: Retold.

    ## Positional arrays

    `/game` uses `application/x-www-form-urlencoded` bodies and **positional
    JSON arrays**: the meaning of a slot comes from its index, not from a key,
    and OpenAPI objects cannot express that. The operations declare
    `x-response-positions`: a list with one entry per slot, in order, each
    entry being an object with the slot `name`, a `description` of its JSON
    type and semantics, its expected `value` when it is a constant, and the
    `row` it repeats when it is an array (the row is documented once, slot by
    slot, in `#/components/schemas/<row>`). The response schema itself is
    always `Positional`. The `/community` API uses named-field JSON objects,
    except where its rows reuse the same positional encodings.

    ## Requests

    * GET: fields are bound from the query string.
    * POST: fields are bound from the `x-www-form-urlencoded` body; with a
      `Content-Type: application/json` request the body is decoded as JSON.
      Unknown keys are ignored, so the fields the clients send and the service
      does not read (always listed in each description) do not fail the call.
    * Responses are `Content-Type: application/json;charset=utf-8` with a
      trailing newline (the raw signed catalogue bodies are the exceptions).

    ## Authentication

    * `/game`: the `sessionID` returned by `POST /game/login/platformlogin`
      (its `connectionToken`), sent in the form body or in the query string.
      A missing or unknown one gets `401 Unauthorized` (plain text). The
      routes that are exempt declare `security: []`:
      `/game/login/platformlogin`, `/game/news/getNews`,
      `/game/Challenge/getChallenges`, `/game/item/getItemBundleItemsJson`,
      `/game/msstore/getStoreTokens` and `/wss/`.
    * `/community`: anonymous; the optional `title` query parameter selects
      the title whose data is answered. A foreign or unknown title answers
      404 with no body, and a missing title on the andromeda host answers 400
      with an HTML error page.

    ## Hosts

    Which host serves which tree (`<tld>` is `.com`): the game hosts are
    `aoe-api.reliclink.com` and `aoe-api.worldsedgelink.com` for every title;
    the release hosts `pb-live-release<N>-api.worldsedgelink.com` (A2),
    `aoeliverelease1/2-api.worldsedgelink.com` and
    `dr-activerelease<N>-api.worldsedgelink.com` (A4),
    `andromeda-live-release<N>-api.worldsedgelink.com` and
    `athens-live-api.worldsedgelink.com` (AoM), plus the A2 macOS hosts
    `arthurlive-api.worldsedgelink.com` and
    `arthurlive-release<N>-api.worldsedgelink.com`. `<N>` also extends to
    further releases when they resolve. They serve `/game` and `/community`.

    ## Signatures

    Several catalogues travel with a `dataSignature` the client verifies with
    an RSA-2048 SPKI it carries in its own process. The scheme is the RelicLink
    variant of PKCS#1 v1.5 with the bare SHA-512 digest (no ASN.1 DigestInfo)
    and maximum-length padding: the body is signed with the decimal ASCII of
    `crc32(body-with-the-signature-emptied)` as the input tag, producing a
    344-character base64 string. For short-parameter requests the signature is
    served raw (`POST /game/item/signItems`).

    ## Errors

    * HTTP `401 Unauthorized` (plain text) for a missing or unknown
      `sessionID`.
    * Positional `[2, ...]` result codes are the functional errors of the
      game tree; the constant or per-error content is documented per
      operation.

    ## Notification socket

    The WebSocket notification socket (`GET /wss/`) is documented elsewhere. When 
    the recipient has no live socket, it served by
    `POST /game/login/readSession`.

    ## Client versions

    A few encodings change with the `clientLibVersion` the client sends at
    login: sanitized alias in profile rows (`>= 190`), a trailing `-1` in the
    login `selectProfile` (`>= 193`), and the AoE III "Baltic Powers"
    advertisement/leaderboard row formats (`>= 194`). The sections below say
    which shape each version gets.
  contact:
    name: LibreMatch community documentation
    url: https://librematch.github.io/wiki/aoe/api/
servers:
- url: https://aoe-api.worldsedgelink.com
  description: Game host (A1, A2, A3, A4; release hosts per description); also serves
    /community
- url: https://andromeda-live-release21-api.worldsedgelink.com
  description: Game host (AoM release family; also athens-live-api.worldsedgelink.com);
    also serves /community with title=athens
tags:
- name: Game
  description: Game client API (positional arrays)
- name: Community
  description: Public object-shaped API over the same data
components:
  securitySchemes:
    GameSession:
      type: apiKey
      in: query
      name: sessionID
      description: |
        Session identifier of the game client API: the `connectionToken` returned by
        `POST /game/login/platformlogin`. The client may send it in the query string
        or in the form body; the API key scheme is used because OpenAPI has no "form
        body credential" kind.
  parameters:
    CommunityTitle:
      name: title
      in: query
      required: false
      schema:
        type: string
      description: |
        The title whose data is answered (`age1`-`age4`, `athens`). Absent: the title
        of the host the request reached. A foreign or unknown title answers 404 with
        no body, and a missing title on the andromeda host answers 400 with an HTML
        error page.
  responses:
    Unauthorized:
      description: Missing or unknown session credential.
      content:
        text/plain:
          schema:
            type: string
            example: Unauthorized
  schemas:
    Positional:
      type: array
      description: 'Positional response of the game client. Every slot means what
        the

        operation''s `x-response-positions` entry at the same index says: an

        entry has `name`, `description`, the constant `value` when the slot

        never changes, and, when the slot is an array, the name of the schema

        its `row`s follow, documented in this file''s components.

        The first element is normally `resultCode` (0 success, 2 error).

        '
      items: {}
    GameProfileRow:
      type: array
      description: |
        The identity row of a profile (`EncodeProfileInfo`): 14 slots below client
        library 190 and 15 from there on (A1 always uses the 14-slot form). `xp` and
        `level` carry the progression of the account.
      items: {}
      x-prefixItems:
      - type: integer
        description: |
          entityVersion: version of the profile record.
      - type: integer
        description: profileId.
      - type: string
        description: 'name: `/steam/<id>` or `/xboxlive/<id>`.'
      - type:
        - string
        - 'null'
        description: 'metaData: avatar metadata set by setAvatarMetadata.'
      - type: string
        description: alias.
      - type: string
        description: 'sanitizedAlias: same as alias (only present from client library
          190).'
      - type: string
        description: |
          clanName: name of the clan of the profile, empty when it has none.
      - type: integer
        description: personalStatGroupID.
      - type: integer
        description: |
          xp: experience of the account.
      - type: integer
        description: |
          level: level of the account.
      - type: integer
        description: 'leaderboardRegionID: 0 (Steam) or 3 (Xbox).'
      - type: 'null'
        description: |
          banInfo: ban record of the account, null when it is not banned.
      - type: string
        description: platformUserID.
      - type: integer
        description: 'accountType: 3 (Steam) or 9 (Xbox).'
      - type: array
        description: |
          linkedPlatformAccounts: platform accounts linked to the profile.
    ClanRow:
      type: array
      description: |
        One clan, as the clan operations answer it: 12 slots (the AoM
        `clan/getClan` answer appends a 13th one).
      items: {}
      x-prefixItems:
      - type: integer
        description: |
          clanID.
      - type: string
        description: |
          tag: the short clan tag (`name` of the community clan object).
      - type: string
        description: |
          name: the full name of the clan (`fullname` of the community clan
          object).
      - type: string
        description: |
          description: the public description.
      - type: string
        description: |
          tags: the clan tags, comma-separated.
      - type: string
        description: |
          icon: the crest id (`CR-001`), or a bare digit in some clans.
      - type: integer
        description: |
          memberCount: members whose row in `clan/getClanInfoFull` has
          `membershipStatus` 1 (the `membercount` of the community clan object;
          the catalogues cap it at 200).
      - type: integer
        description: |
          count of the member rows with another `membershipStatus` (0 or 4 in the
          captures).
      - type: integer
        description: |
          joinPolicy: who may join (0 open, 1 invite/request only, 2 closed).
      - type: string
        description: |
          metadata: the clan metadata, empty when it has none.
      - type: string
        description: |
          messageOfTheDay: the message shown to the members, empty when it has
          none.
      - type: integer
        description: |
          statGroupID: the stat group of the clan.
      - type: integer
        description: |
          Only in the AoM `clan/getClan` answer: the entity version of a member
          row (the second slot of that row in `clan/getClanInfoFull`).
    PresenceSuffixRow:
      type: array
      description: 'Presence appended after a profile row by the presence-aware encoders

        (relationships, FindProfiles*, Presence frames).

        '
      items: {}
      x-prefixItems:
      - type: integer
        description: 'presenceID: the id set by setPresence (1 online at login).'
      - type:
        - string
        - 'null'
        description: |
          presenceLocalized: localised label of the presence, null when there is none.
      - type: array
        description: 'presencePropertyInfo: [[propertyDefID, value], ...] set by setPresenceProperty.'
    AccountInfoRow:
      type: array
      description: The platform-account block of the platformlogin response.
      items: {}
      x-prefixItems:
      - type: integer
        description: profileId.
      - type: string
        description: 'accountName: `/steam/<id>` or `/xboxlive/<id>`.'
      - type: integer
        description: 'accountType: 3 (Steam) or 9 (Xbox).'
      - type: integer
        description: |
          ssoID: single sign-on id of the account, -1 when it has none.
      - type: integer
        description: |
          ssoStatus: state of the single sign-on link (0 not linked).
      - type: string
        description: |
          country: country of the account.
      - type: string
        description: |
          currency: currency of the account.
      - type: integer
        description: 'spamAllowed: 2 (allow all).'
      - type: 'null'
        description: metaData.
    AvatarStatRow:
      type: array
      description: Avatar statistics (setAvatarStatValues, selectProfile stats, GetAvatarStatForProfile).
      items: {}
      x-prefixItems:
      - type: integer
        description: statID (avatarstat definition id.
      - type: integer
        description: profileID.
      - type: integer
        description: 'value (int64 on the wire: JSON number).'
      - type:
        - string
        - 'null'
        description: 'metadata: raw JSON the client holds or null.'
      - type: integer
        description: 'lastUpdated: unix seconds.'
    RelayServerRow:
      type: array
      description: |
        One relay (battle) server of the platformlogin response: the Azure region, its
        display name, the IPv4 address and the three ports the clients connect to. The
        service answers roughly 9-12 regions.
      items: {}
      x-prefixItems:
      - type: string
        description: |
          region: the Azure region of the relay ("westeurope", ...).
      - type:
        - string
        - 'null'
        description: |
          displayName: display name of the region; A1 omits this slot, A3/A4 send null.
      - type: string
        description: IPv4 address.
      - type: integer
        description: |
          battle server port.
      - type: integer
        description: WebSocket port.
      - type: integer
        description: out-of-band port (slots 6 only for A2/A3/A4/AoM
          — A1 stops at 5).
    ClientSettingsRow:
      type: array
      description: |
        One [key, value] pair of the `clientSettings` block of platformlogin.
      items: {}
      x-prefixItems:
      - type: string
        description: setting key, e.g. RL_KEEPALIVE.
      - type: string
        description: setting value, verbatim from the catalog.
    SelectProfileArray:
      type: array
      description: 'The `selectProfile` block of platformlogin. Slot 9 (`privacySettings`)

        is absent on A1; slot 10 (`extra`) appears from client library 193:

        A1 9 slots, A2 at library 190 10 slots, newer clients 11 slots.

        '
      items: {}
      x-prefixItems:
      - type: integer
        description: resultCode (0).
      - type: array
        description: 'profile: one GameProfileRow.'
        items: {}
      - type: array
        description: 'relationships: RelationshipsArray (8 slots).'
      - type: array
        description: 'leaderboardStats: filled for A2 and for AoE3 >= the Baltic Powers
          only; [] otherwise (the official service fills it for every modern title).'
      - type: array
        description: |
          stats: AvatarStatRow list of the profile; A1 sends null.
        items: {}
      - type: 'null'
        description: clanInfo.
      - type: array
        description: |
          clanMembershipRequests: clan membership requests of the profile.
      - type: 'null'
        description: extendedData.
      - type: integer
        description: |
          enableCrossplay: 1 when crossplay is enabled.
      - type: array
        description: 'privacySettings: [] (not sent to A1).'
      - type: integer
        value: -1
        description: 'extra: -1 (client library 193+ only).'
    RelationshipsArray:
      type: array
      description: |
        The relationship answer shared by platformlogin's selectProfile and
        getRelationships: 8 slots.
      items: {}
      x-prefixItems:
      - type: integer
        description: resultCode (0).
      - type: array
        description: |
          friends: GameProfileRow + presence suffix rows; A1/A2 keep this slot empty.
        items: {}
      - type: array
        description: |
          friendRequests: pending friend requests.
      - type: array
        description: |
          incomingInvitations: invitations received.
      - type: array
        description: |
          outgoingInvitations: invitations sent.
      - type: array
        description: 'lastConnections: filled for A1/A2, empty for A3/A4/AoM.'
        items: {}
      - type: array
        description: |
          ignored: ignored profiles.
      - type: array
        description: |
          blocked: blocked profiles.
    ReplayDescriptorRow:
      type: array
      description: 'One replay upload descriptor of reportMatch / createOrReportSinglePlayer.

        Either filled or the empty form.

        '
      items: {}
      x-prefixItems:
      - type: integer
        description: 'matchID (empty form: -1).'
      - type: string
        description: 'url: `http(s)://<host>/cloudfiles/replays/<matchID>/<kind|S_<matchID>>/<sha>.gz`
          ("" when empty).'
      - type: string
        description: host the URL belongs to ("" when empty).
      - type: string
        description: path below /cloudfiles ("" when empty).
      - type: integer
        description: |
          uploader kind: 0 | 1 (multiplayer), 1 for single player (0 when empty).
      - type: string
        description: sas query string `sig=<credential>&se=<RFC3339>&sv=2019-02-02&sp=cw&sr=b`
          ("" when empty).
    StatGroupRow:
      type: array
      description: The stat-group row paired with leaderboard responses.
      items: {}
      x-prefixItems:
      - type: integer
        description: statGroupID (A1 uses the profile id, newer titles their own range).
      - type: string
        description: |
          name: display name of the stat group.
      - type: string
        description: |
          metadata: opaque metadata of the group.
      - type: integer
        description: 'type: 1 (player) — no clan stat groups exist.'
      - type: integer
        description: profileID of the single member.
    LeaderboardStatRow:
      type: array
      description: |
        Leaderboard statistics row of the ranked ladders, 19 slots for the modern
        encoders; A1 (and AoE III below the Baltic Powers) uses a 16-slot legacy form
        whose last two entries are the string "{}" (counters) and the custom updates
        JSON, closing with lastMatchTime.
      items: {}
      x-prefixItems:
      - type: integer
        description: statgroupID.
      - type: integer
        description: leaderboardID (A4 unrated 0; AoM -1).
      - type: integer
        description: wins.
      - type: integer
        description: losses.
      - type: integer
        description: 'streak: positive on a winning run, negative on a losing one.'
      - type: integer
        description: |
          disputes: results still under review.
      - type: integer
        description: |
          drops: matches abandoned by the player.
      - type: integer
        description: 'ranking: -1 when unrated.'
      - type: integer
        description: |
          rankTotal: number of players in the ladder; -1 unknown ladder, 0 empty.
      - type: integer
        description: |
          regionRanking: rank of the player inside the region.
      - type: integer
        description: |
          regionRankTotal: number of players in the regional ladder.
      - type: integer
        description: |
          level: level reported by the ladder.
      - type: integer
        description: rating (1000 default / DefaultRating until matches move it).
      - type: integer
        description: |
          lastMatchTime: unix seconds of the last rated match, 0 when never.
      - type: integer
        description: |
          highestRank: peak rank of the player.
      - type: integer
        description: |
          highestRankLevel: level at the peak rank.
      - type: integer
        description: |
          highestRating: peak rating of the player.
      - type: integer
        description: |
          platformRank: rank of the player on the platform ladder.
      - type: integer
        description: |
          platformRankTotal: number of players on the platform ladder.
      - type: string
        description: 'counters legacy form (A1): "{}" — check the operation''s note
          for which form is used.'
      - type: string
        description: 'custom updates legacy form (A1): "{}".'
      - type: integer
        description: lastMatchTime legacy form (A1).
    PeerRow:
      type: array
      description: 'One peer of a lobby. The internal advertisement address is a

        synthetic `10.0.11.N` space.

        '
      items: {}
      x-prefixItems:
      - type: integer
        description: advertisementID (match id in the party context).
      - type: integer
        description: profileID.
      - type: integer
        description: |
          ranking: rank of the peer.
      - type: integer
        description: statGroupID.
      - type: integer
        description: raceID (civilization).
      - type: integer
        description: teamID (-1 when unset; A2/A4 leave -1, A1/A3/AoM carry the real
          slot).
      - type: string
        description: 'address: "/10.0.11.N" synthetic peer address.'
    AdvertisementRow:
      type: array
      description: 'One lobby. Modern titles (A2, A4, AoM, and A3 from client library

        194 "The Baltic Powers") use the 27-slot form; A3 below 194 uses a

        23-slot form without slots 2-4 and without the repeated description;

        A1 uses a 22-slot form that also drops the battle-server name slot.

        The password is never echoed, only its presence.

        '
      items: {}
      x-prefixItems:
      - type: integer
        description: '0: advertisementID.'
      - type: integer
        description: '1: platformSessionID (psnSessionID / Steam session, stored by
          updatePlatformSessionID).'
      - type:
        - string
        - integer
        description: |
          2: goodoldgameslobbyid: the GOG lobby id, 0 when the lobby is not on GOG.
      - type: string
        description: |
          3: platform session ID (A1 and A3 below 194 omit this slot).
      - type: string
        description: |
          4: platform match ID (A1 and A3 below 194 omit this slot).
      - type: string
        description: |
          5: xboxSessionId: the Xbox session id (A1 keeps this slot) or the Xbox session metadata JSON.
      - type: integer
        description: 'next: hostProfileID.'
      - type: integer
        description: 'next: state: 0 open, 1 started.'
      - type: string
        description: 'next: description (27-slot form repeats it in the next slot).'
      - type: string
        description: 'next: description repeated (27-slot form only).'
      - type: integer
        description: 'next: visible 0/1.'
      - type: string
        description: 'next: mapName.'
      - type: string
        description: 'next: options: opaque base64+zlib block.'
      - type: integer
        description: 'next: passwordEnabled 0/1 (the password itself is never echoed).'
      - type: integer
        description: 'next: maxplayers.'
      - type: string
        description: 'next: slotinfo: opaque base64+zlib block.'
      - type: integer
        description: 'next: matchtype: 0 custom, 1/13 session/party, 19 matchmaking,
          A4 the pool id.'
      - type: array
        description: 'next: peers: PeerRow list.'
        items: {}
      - type: integer
        description: 'next: observer count.'
      - type: integer
        description: |
          next: observermax: 512 online, 0 in a LAN-only lobby.
      - type: integer
        description: 'next: isObservable 0/1.'
      - type: integer
        description: 'next: observerDelay (seconds).'
      - type: integer
        description: 'next: hasObserverPassword 0/1.'
      - type: integer
        description: 'next: lan: 0/1 (serviceType).'
      - type:
        - integer
        - 'null'
        description: 'next: startTime: unix seconds once started, null before.'
      - type: string
        description: 'next: relayRegion: region name or LAN GUID.'
      - type:
        - string
        - 'null'
        description: |
          last in the 27-slot form: battleServerName: name of the battle server, null (A3/A4) or omitted (A1).
    BattleServerAddress:
      type: array
      description: |
        The battle server block embedded in host/startObserving answers: the relay
        host, its ports and its name; the answers describe Azure relay hosts.
      items: {}
      x-prefixItems:
      - type: string
        description: |
          IPv4 address of the relay; empty for LAN lobbies.
      - type: integer
        description: battle server port (e.g. 27012).
      - type: integer
        description: WebSocket port (e.g. 27112).
      - type: integer
        description: out-of-band port (e.g. 27212; slot only for A2/A3/A4/AoM — A1
          stops at 3).
    MatchHistoryRow:
      type: array
      description: 'One match of getRecentMatchHistory (game tree). The counters and

        custom-update strings echo what reportMatch stored; "AUTOMATCH" as

        description marks rated games.

        '
      items: {}
      x-prefixItems:
      - type: integer
        description: matchHistoryID.
      - type: integer
        description: 'creatorProfileID: first reporter.'
      - type: string
        description: mapName.
      - type: integer
        description: maxplayers.
      - type: integer
        description: 'matchTypeID: the automatch pool when queued.'
      - type: string
        description: 'encodedOptions: opaque base64+zlib block.'
      - type: string
        description: 'encodedSlots: opaque base64+zlib block.'
      - type: string
        description: 'description: "AUTOMATCH" for rated matches.'
      - type: integer
        description: 'startGameTime: unix seconds.'
      - type: integer
        description: 'completionTime: unix seconds.'
      - type: integer
        description: |
          observerTotal: number of observers of the match.
      - type: array
        description: 'matchhistoryreportresults: MatchReportResultRow list.'
        items: {}
      - type: array
        description: |
          matchhistoryitems: per-player history rows of the match.
      - description: 'matchurls: MatchUrlRow list.'
      - type: array
        description: 'matchVersionInfo: ["INVALID","INVALID","INVALID",0,0,0,0].'
        items: {}
      - description: 'memberstats: MatchMemberStatRow list.'
    MatchReportResultRow:
      type: array
      description: One player row of a match-history report result.
      items: {}
      x-prefixItems:
      - type: integer
        description: matchhistoryID.
      - type: integer
        description: profileID.
      - type: integer
        description: 'resultType: 0 loss, 1 win, 3 draw/incomplete.'
      - type: integer
        description: teamID.
      - type: integer
        description: raceID (civilization).
      - type: integer
        description: xpgained.
      - type: string
        description: |
          counters: JSON object string, "{}" when empty (e.g. {"rankedMatch":0} on AoE3).
      - type: string
        description: 'customUpdates: JSON object string with itemUpdates/challengeUpdates/eventChallengeUpdates/clientUpdates.'
      - type: integer
        description: 'matchstartdate: unix seconds.'
    MatchUrlRow:
      type: array
      description: 'One replay URL of a match row. The URL carries no SAS signature:
        the

        game calls getTempCredentials for the same key before downloading.

        '
      items: {}
      x-prefixItems:
      - type: integer
        description: uploader/creator profile id.
      - type: string
        description: url below /cloudfiles.
      - type: integer
        description: length in bytes.
      - type: integer
        description: 'kind: 0 (classic) / 1 (AOE rec).'
    MatchMemberStatRow:
      type: array
      description: One ratings row of a match row.
      items: {}
      x-prefixItems:
      - type: integer
        description: matchHistoryID.
      - type: integer
        description: profileID.
      - type: integer
        description: raceID.
      - type: integer
        description: statGroupID.
      - type: integer
        description: teamID.
      - type: integer
        description: wins.
      - type: integer
        description: losses.
      - type: integer
        description: streak.
      - type: integer
        description: 'arbitration: 1.'
      - type: integer
        description: outcome.
      - type: integer
        description: 'oldRating: 1000 default until a rating exists.'
      - type: integer
        description: newRating.
      - type: integer
        description: 'reportType: 1.'
    EventChallengeProgressRow:
      type: array
      description: |
        One event-challenge progress record of the session user: the assigned time,
        the counters and the completion state the service reports for the profile.
      items: {}
      x-prefixItems:
      - type: integer
        description: 'progressID: sequential id.'
      - type: integer
        description: challengeID of the event definition.
      - type: integer
        description: 'completionCount: 0 not completed.'
      - type: integer
        description: 'progress: 0.'
      - type:
        - integer
        - 'null'
        description: expiryTime; null in the AoE4 capture.
      - type:
        - integer
        - 'null'
        description: 'lastCompletedTime: null.'
      - type: integer
        description: eventID.
      - type: integer
        description: 'assignedTime: unix seconds.'
    ChallengeProgressRow:
      type: array
      description: |
        One challenge progress record: the assigned time, the progress counters and
        the completion state the service reports for the profile.
      items: {}
      x-prefixItems:
      - type: integer
        description: 'progressID: sequential id.'
      - type: integer
        description: definitionID (challenges.json).
      - type: integer
        description: 'completionCount: 1 completed.'
      - type: integer
        description: 'progress: 0.'
      - type:
        - integer
        - 'null'
        description: 'expiryTime: null.'
      - type:
        - integer
        - 'null'
        description: 'lastCompletedTime: unix seconds.'
      - type: integer
        description: |
          assignedTime: unix seconds at which the challenge was assigned (before lastCompleted).
    CommunityEventRow:
      type: array
      description: |
        One event of the game-tree CommunityEvent answer. A4 carries its rolling
        seasons, AoM the daily and pantheon events with their ladders, A2 its regular
        event, and A1/A3 answer an empty list.
      items: {}
      x-prefixItems:
      - type: string
        description: name.
      - type: integer
        description: 'start: unix seconds.'
      - type: integer
        description: 'end: unix seconds.'
      - type: integer
        description: expiry / eventID position depends on the title block..
      - type: integer
        description: 'eventID.'
      - type: integer
        description: |
          eventState (1 running, 2 finished).
      - type: 'null'
        description: |
          extra slot: the event type of the title.
      - type: string
        description: 'customdata: JSON string (A4 season metadata; AoM daily challenge
          config; empty for pantheon).'
    NewsRow:
      type: array
      description: |
        One news entry of the game-tree getNews: the title, the text, the image and
        the date it becomes visible.
      items: {}
      x-prefixItems:
      - type:
        - integer
        - string
        description: 'id: numeric.'
      - type: string
        description: category.
      - type: string
        description: title.
      - type:
        - string
        - 'null'
        description: subtitle.
      - type: string
        description: text (the A3 official row layout differs; check the title).
      - type: string
        description: image URL.
      - type: string
        description: body.
      - type: string
        description: metadata.
      - type:
        - string
        - integer
        description: 'dateVisible: unix seconds (decimal string tolerated).'
      - type:
        - string
        - integer
        description: 'dateExpiry: unix seconds (decimal string tolerated).'
    ItemInstanceRow:
      type: array
      description: |
        One item instance of a profile's inventory: the instance id, the definition it
        belongs to, its attributes and the permission mask of the operations it
        allows.
      items: {}
      x-prefixItems:
      - type: integer
        description: |
          itemID: instance id of the item.
      - type: integer
        description: 'entityVersion: 0, +1 on every change.'
      - type: integer
        description: itemDefinitionID.
      - type: integer
        description: 'profileID: owner.'
      - type: integer
        description: 'durability: 1 default; -1 leaves it unchanged in detach.'
      - type: integer
        description: 'durabilityType: 0.'
      - type: string
        description: 'metadata: JSON string {"att":{"<key>":{"val":..}}, values written
          by updateItemAttributes carry source/mtype 0/1}.'
      - type: integer
        description: 'creationDate: unix seconds.'
      - type: integer
        description: 'locationID: 0 root inventory; AoE4 specials 3 portrait / 4 coat
          of arms / 5 monument; or a container itemID (moveItem).'
      - type: integer
        description: 'tradeID: -1 (none).'
      - type: integer
        description: |
          permissionFlags: mask of the operations the instance allows.
      - type: integer
        description: 'maxChargesPerItem: -1 (none).'
    ItemLocationRow:
      type: array
      description: One item location, from the per-title itemLocations.json.
      items: {}
      x-prefixItems:
      - type: integer
        description: location id.
      - type: integer
        description: 'entityVersion: 0.'
      - type: integer
        description: locationID.
      - type: integer
        description: categoryID.
      - type: integer
        description: maxItems.
      - type: integer
        description: 'locked: 0/1.'
      - type: integer
        description: 'isPublic: 0/1.'
      - type: integer
        description: 'isForMatch: 0/1.'
      - type: integer
        description: 'tracksMoves: 0/1.'
    LoadoutRow:
      type: array
      description: One item loadout.
      items: {}
      x-prefixItems:
      - type: integer
        description: |
          loadoutID: id of the loadout.
      - type: integer
        description: profileID.
      - type: string
        description: 'name (client: "GameplayItemsdefault_layout").'
      - type: integer
        description: 'type: 1001 (gameplay items).'
      - type: string
        description: 'attributes: "[]" (the real attribute JSON is not produced yet).'
    ChatChannelRow:
      type: array
      description: One chat channel.
      items: {}
      x-prefixItems:
      - type: integer
        description: channelID (1 General, 2 Help — AoE III catalog only).
      - type: string
        description: name.
      - type: string
        description: description.
      - type: integer
        description: live member count.
    FileDescriptorRow:
      type: array
      description: |
        One builtin asset descriptor of cloud/getFileURL. Slot 5 (the blob key
        repeated) is appended for A2 and in the AoM answers.
      items: {}
      x-prefixItems:
      - type: string
        description: 'name: the echoed asset name.'
      - type: integer
        description: length in bytes.
      - type: integer
        description: 'id: static catalogue id (e.g. 741324928).'
      - type: string
        description: 'url: `https://<host>/cloudfiles/<key>` (the official answers
          point at Azure blob/CDN hosts).'
      - type: string
        description: 'finalPart: the key — slot only for A2.'
    AutomatchMapRow:
      type: array
      description: |
        One map of the automatch pool; the pool rotates between sessions.
      items: {}
      x-prefixItems:
      - type: integer
        description: mapID.
      - type: string
        description: name.
      - type: integer
        description: teams.
      - type: integer
        description: max players.
      - type: integer
        description: pool / queue id.
      - type:
        - string
        - 'null'
        description: localizedName.
      - type: 'null'
        description: extra.
      - type: string
        description: extra.
    PartyRow:
      type: array
      description: One [rowCode, itemInstanceRow] roster element of a chat roster.
      items: {}
      x-prefixItems:
      - type: integer
        description: |
          row code: 0.
      - type: array
        description: member GameProfileRow.
        items: {}
    CommunityResult:
      type: object
      description: Envelope of every /community response. A bad `title` query parameter
        is answered with the code-2 envelope over HTTP 200.
      required:
      - code
      - message
      properties:
        code:
          type: integer
          description: |
            0 success, 2 invalid request (including a title the service does not serve).
        message:
          type: string
          example: SUCCESS
    CommunityProfile:
      type: object
      description: |
        The /community object form of a profile: `xp` and `level` are the progression
        of the account, `country` its country and `clanlist_name` its clan (empty when
        the player has none).
      required:
      - profile_id
      - name
      - alias
      - personal_statgroup_id
      - xp
      - level
      - leaderboardregion_id
      - country
      - clanlist_name
      properties:
        profile_id:
          type: integer
        name:
          type: string
          description: Platform identity, `/steam/<id>` or `/xboxlive/<id>`.
        alias:
          type: string
        personal_statgroup_id:
          type: integer
        xp:
          type: integer
        level:
          type: integer
        leaderboardregion_id:
          type: integer
        country:
          type: string
          description: |
            Country of the account, empty when it is unknown.
        clanlist_name:
          type: string
          description: |
            Clan of the player, empty when the player has none.
    CommunityStatGroup:
      type: object
      required:
      - id
      - name
      - type
      - members
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: integer
          description: |
            1 for a player stat group, 2 for a clan one.
        members:
          type: array
          items:
            $ref: '#/components/schemas/CommunityProfile'
    CommunityLeaderboardStat:
      type: object
      description: |
        18 fields, the shape the live service returns (the wiki documents 14).
        `regionrank`, `regionranktotal`, `highestrank` and `highestranklevel` are the
        regional standing and the peak of the player.
      required:
      - statgroup_id
      - leaderboard_id
      - wins
      - losses
      - streak
      - disputes
      - drops
      - rank
      - ranktotal
      - ranklevel
      - rating
      - regionrank
      - regionranktotal
      - lastmatchdate
      - highestrank
      - highestranklevel
      - highestrating
      - metadata
      properties:
        statgroup_id:
          type: integer
        leaderboard_id:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        streak:
          type: integer
          description: Positive for a winning streak, negative for a losing one.
        disputes:
          type: integer
          description: |
            0 when the ladder does not publish the value.
        drops:
          type: integer
          description: |
            0 when the ladder does not publish the value.
        rank:
          type: integer
          description: -1 when the profile holds no rank.
        ranktotal:
          type: integer
          description: |
            Number of players in the ladder; -1 unknown ladder, 0 empty.
        ranklevel:
          type: integer
          enum:
          - -1
          - 0
          - 1
        rating:
          type: integer
        regionrank:
          type: integer
          description: |
            Rank of the player inside the region.
        regionranktotal:
          type: integer
          description: |
            -1 when the ladder does not publish the value.
        lastmatchdate:
          type: integer
        highestrank:
          type: integer
          description: |
            Peak rank of the player.
        highestranklevel:
          type: integer
          description: |
            0 when the ladder does not publish the value.
        highestrating:
          type: integer
        metadata:
          type: string
    CommunityLeaderboardMap:
      type: object
      required:
      - matchtype_id
      - statgroup_type
      - civilization_id
      properties:
        matchtype_id:
          type: integer
        statgroup_type:
          type: integer
        civilization_id:
          type: integer
          description: The official name of this field's family is race_id; the live
            service already answers civilization_id.
    CommunityLeaderboard:
      type: object
      required:
      - id
      - name
      - isranked
      - leaderboardmap
      properties:
        id:
          type: integer
        name:
          type: string
        isranked:
          type: integer
        leaderboardmap:
          type: array
          items:
            $ref: '#/components/schemas/CommunityLeaderboardMap'
    CommunityMatchType:
      type: object
      required:
      - id
      - name
      - locstringid
      properties:
        id:
          type: integer
        name:
          type: string
        locstringid:
          type: integer
          description: |
            Localisation id of the name, -1 when the catalogue carries the text verbatim.
        localizedName:
          type: string
    CommunityRace:
      type: object
      required:
      - id
      - name
      - faction_id
      - locstringid
      properties:
        id:
          type: integer
        name:
          type: string
        faction_id:
          type: integer
        locstringid:
          type: integer
        localizedName:
          type: string
    CommunityFaction:
      type: object
      required:
      - id
      - name
      - locstringid
      - faction_id
      properties:
        id:
          type: integer
        name:
          type: string
        locstringid:
          type: integer
        faction_id:
          type: integer
    CommunityRegion:
      type: object
      required:
      - id
      - name
      - locstringid
      properties:
        id:
          type: integer
        name:
          type: string
        locstringid:
          type: integer
        localizedName:
          type: string
    CommunityNewsItem:
      type: object
      description: |
        11 named fields. `newstitle_locstringid`, `newssubtitle_locstringid` and
        `newstext_locstringid` are the localisation ids of the translated strings (-1
        when the entry carries no localised text). AoM maps the catalogue image slot
        to newsimage and the other titles to the headline slot.
      required:
      - id
      - hidden
      - newscategory
      - newstitle_locstringid
      - newssubtitle_locstringid
      - newstext_locstringid
      - newsimage
      - newsbody
      - metadata
      - datevisible
      - expirytime
      properties:
        id:
          description: Numeric or string, as declared in news.toml.
        hidden:
          type: integer
        newscategory:
          type: string
        newstitle_locstringid:
          type: integer
        newssubtitle_locstringid:
          type: integer
        newstext_locstringid:
          type: integer
        newsimage:
          type: string
        newsbody:
          type: string
        metadata:
          type: string
        datevisible:
          type: integer
        expirytime:
          type: integer
    CommunityAchievementDefinition:
      type: object
      required:
      - id
      - name
      - name_locstringid
      - description_locstringid
      - icon
      - timemodified
      - deleted
      - itembundle_id
      properties:
        id:
          description: Numeric or string catalogue id.
        name:
          type: string
        name_locstringid:
          type: integer
          description: |
            Localisation id of the name, -1 when the text travels verbatim.
        description_locstringid:
          type: integer
          description: |
            -1 when the ladder does not publish the value.
        icon:
          type: string
        timemodified:
          type: integer
        deleted:
          type: integer
          description: Rows with deleted != 0 are not served.
        itembundle_id:
          type: integer
          description: -1 when the catalogue row carries no bundle.
    CommunityEarnedAchievement:
      type: object
      properties:
        achievement_id:
          type: integer
        achieveddate:
          type: integer
    CommunityAvatarStat:
      type: object
      required:
      - profile_id
      - avatarstat_id
      - value
      - lastupdated
      properties:
        profile_id:
          type: integer
        avatarstat_id:
          type: integer
        value:
          type: integer
        lastupdated:
          type: integer
    CommunityMatchURL:
      type: object
      required:
      - profile_id
      - url
      - size
      - datatype
      properties:
        profile_id:
          type: integer
        url:
          type: string
        size:
          type: integer
        datatype:
          type: integer
          description: 0 or 1 (replay kind).
    CommunityReportResult:
      type: object
      required:
      - matchhistory_id
      - profile_id
      - resulttype
      - teamid
      - civilization_id
      - xpgained
      - counters
      - customupdates
      - matchstartdate
      properties:
        matchhistory_id:
          type: integer
        profile_id:
          type: integer
        resulttype:
          type: integer
        teamid:
          type: integer
        civilization_id:
          type: integer
        xpgained:
          type: integer
        counters:
          type: string
          description: JSON object string, "{}" when empty.
        customupdates:
          type: string
          description: JSON object string with itemUpdates/challengeUpdates/eventChallengeUpdates/clientUpdates.
        matchstartdate:
          type: integer
    CommunityMatchMember:
      type: object
      required:
      - matchhistory_id
      - profile_id
      - civilization_id
      - statgroup_id
      - teamid
      - wins
      - losses
      - streak
      - arbitration
      - outcome
      - oldrating
      - newrating
      - reporttype
      properties:
        matchhistory_id:
          type: integer
        profile_id:
          type: integer
        civilization_id:
          type: integer
        statgroup_id:
          type: integer
        teamid:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        streak:
          type: integer
        arbitration:
          type: integer
        outcome:
          type: integer
        oldrating:
          type: integer
        newrating:
          type: integer
        reporttype:
          type: integer
    CommunityMatch:
      type: object
      description: One match row of the /community match-history endpoints (`gamemod_id`
        is 1800 on getMatchHistory and 0 on getRecentMatchHistory).
      required:
      - id
      - creator_profile_id
      - mapname
      - maxplayers
      - matchtype_id
      - options
      - slotinfo
      - description
      - startgametime
      - completiontime
      - observertotal
      - matchhistoryreportresults
      - matchhistoryitems
      - matchurls
      - matchhistorymember
      - gamemod_id
      properties:
        id:
          type: integer
        creator_profile_id:
          type: integer
        mapname:
          type: string
        maxplayers:
          type: integer
        matchtype_id:
          type: integer
        options:
          type: string
          description: Base64+zlib block echoed verbatim.
        slotinfo:
          type: string
          description: Base64+zlib block echoed verbatim.
        description:
          type: string
          description: '"AUTOMATCH" for a rated or queued match.'
        startgametime:
          type: integer
        completiontime:
          type: integer
        observertotal:
          type: integer
          description: |
            Observers the match had.
        matchhistoryreportresults:
          type: array
          items:
            $ref: '#/components/schemas/CommunityReportResult'
        matchhistoryitems:
          type: array
          description: |
            Per-player rows of the match.
          items: {}
        matchurls:
          type: array
          items:
            $ref: '#/components/schemas/CommunityMatchURL'
        matchhistorymember:
          type: array
          items:
            $ref: '#/components/schemas/CommunityMatchMember'
        gamemod_id:
          type: integer
          description: 1800 on getMatchHistory, 0 on getRecentMatchHistory (live-service
            behaviour).
    CommunityMatchSummaryMember:
      type: object
      required:
      - match_id
      - profile_id
      - ranking
      - statgroup_id
      - civilization_id
      - teamid
      properties:
        match_id:
          type: integer
        profile_id:
          type: integer
        ranking:
          type: integer
          description: |
            -1 when the ladder does not publish the value.
        statgroup_id:
          type: integer
        civilization_id:
          type: integer
        teamid:
          type: integer
    CommunityMatchSummary:
      type: object
      description: One lobby of /community/advertisement/findAdvertisements.
      required:
      - id
      - steamlobbyid
      - goodoldgameslobbyid
      - xboxsessionid
      - host_profile_id
      - state
      - description
      - visible
      - mapname
      - options
      - passwordprotected
      - maxplayers
      - slotinfo
      - matchtype_id
      - matchmembers
      - observernum
      - observermax
      - isobservable
      - observerdelay
      - hasobserverpassword
      - servicetype
      - relayserver_region
      properties:
        id:
          type: integer
        steamlobbyid:
          type: integer
          description: |
            Steam lobby id, 0 when the lobby is not on Steam.
        goodoldgameslobbyid:
          type: integer
          description: |
            0 when the ladder does not publish the value.
        xboxsessionid:
          type: string
        host_profile_id:
          type: integer
        state:
          type: integer
        description:
          type: string
        visible:
          type: integer
        mapname:
          type: string
        options:
          type: string
        passwordprotected:
          type: integer
          description: 1/0; lobby passwords are never exposed.
        maxplayers:
          type: integer
        slotinfo:
          type: string
        matchtype_id:
          type: integer
        matchmembers:
          type: array
          items:
            $ref: '#/components/schemas/CommunityMatchSummaryMember'
        observernum:
          type: integer
        observermax:
          type: integer
        isobservable:
          type: integer
        observerdelay:
          type: integer
        hasobserverpassword:
          type: integer
          description: 1/0; the observer password is never exposed.
        servicetype:
          type: integer
          description: 0/1 (LAN lobbies are 1).
        relayserver_region:
          type: string
    CommunityReplayFile:
      type: object
      required:
      - profile_id
      - matchhistory_id
      - url
      - size
      - datatype
      properties:
        profile_id:
          type: integer
          description: |
            Profile that uploaded the replay.
        matchhistory_id:
          type: integer
        url:
          type: string
          description: Plain LAN URL without a SAS signature.
        size:
          type: integer
        datatype:
          type: integer
          description: 0 or 1 (replay kind).
    CommunityEvent:
      type: object
      description: One event of /community/CommunityEvent/getAvailableCommunityEvents.
      required:
      - id
      - name
      - start
      - end
      - expiryTime
      - customdata
      - eventstate
      - eventtype
      properties:
        id:
          type: integer
          description: A4 rolling seasons (RankedSeasonEventIDBase + offset) or the
            AoM catalogue id.
        name:
          type: string
        start:
          type: integer
          description: Unix seconds.
        end:
          type: integer
          description: Unix seconds.
        expiryTime:
          type: integer
          description: Unix seconds.
        scheduledstarttime:
          type: integer
        scheduledendtime:
          type: integer
        scheduledexpirytime:
          type: integer
        actualstarttime:
          type: integer
        actualendtime:
          type: integer
        customdata:
          type: string
          description: JSON string carried verbatim (season metadata, AoM daily challenge
            config).
        eventstate:
          type: integer
          description: |
            State of the event: 1 running, 2 finished.
        eventtype:
          type: integer
          description: |
            Type of the event: A4 rolling seasons 6, AoM daily 2 / pantheon 3.
        localizedName:
          type: string
          description: Same as name (omitted when empty).
    CommunityEventLeaderboard:
      type: object
      description: One event ladder of the AoM event block.
      required:
      - communityevent_id
      - id
      - name
      - isranked
      - scoringtype
      properties:
        communityevent_id:
          type: integer
        id:
          type: integer
        name:
          type: string
        isranked:
          type: integer
        scoringtype:
          type: integer
    CommunityEventLeaderboardMap:
      type: object
      description: One event ladder map of the AoM event block.
      required:
      - communityevent_id
      - communityeventleaderboard_id
      - matchtype_id
      - statgroup_type
      - civilization_id
      properties:
        communityevent_id:
          type: integer
        communityeventleaderboard_id:
          type: integer
        matchtype_id:
          type: integer
        statgroup_type:
          type: integer
        civilization_id:
          type: integer
    SteamPlayer:
      type: object
      properties:
        steamid:
          type: string
        communityvisibilitystate:
          type: integer
        profilestate:
          type: integer
        personaname:
          type: string
        profileurl:
          type: string
        avatar:
          type: string
        avatarmedium:
          type: string
        avatarfull:
          type: string
        avatarhash:
          type: string
        personastate:
          type: integer
        realname:
          type: string
        primaryclanid:
          type: string
        timecreated:
          type: integer
        personastateflags:
          type: integer
        loccountrycode:
          type: string
    SteamResponse:
      type: object
      properties:
        response:
          type: object
          properties:
            players:
              type: array
              description: |
                Steam profiles the request resolved.
              items:
                $ref: '#/components/schemas/SteamPlayer'
paths:
  /game/login/platformlogin:
    post:
      tags:
      - Game
      summary: |
        Logs in to the game service and creates the session
      description: |
        Authenticates the platform account from `accountType`, `platformUserID`,
        `alias`, `title`, `macAddress`, `clientLibVersion` and the platform ticket in
        `auth`, sets the `reliclink` cookie, publishes the join presence, notifies the
        other connected clients and returns
        the relay servers of the account's region. The session token travels as
        `connectionToken` in the answer and is the `sessionID` every other route
        sends.

        It is an anonymous route (it is the one that mints the session). When the
        platform ticket cannot be validated the answer is the 2-coded array, whose
        `serverTime` slot — unlike the success path — carries an RFC3339 string.

        AoE1 sends every parameter in the query string and repeats them in the body
        (the binder reads the body); it also receives one extra top-level slot
        (`extra`, always `[]`) after `banMessage`, and no `stats` row inside
        `selectProfile` (null instead of `[]`).

        `selectProfile.leaderboardStats` carries one row per ladder the profile is
        placed on; `accountInfo` carries the country and currency of the account; the
        `Request-Context` header identifies the application (AoE1-3 use their fixed
        application id, newer deployments vary) and `Request-Path` carries the request
        path.
      operationId: gamePlatformLogin
      x-games:
      - A1
      - A2
      - A3
      - A4
      - AoM
      x-response-positions:
      - name: resultCode
        description: |
          0 on success; 2 when the platform ticket cannot be validated. On error the
          rest of the array keeps the same length but reads `""`/0/null per slot, and
          `serverTime` is an RFC3339 string.
        value: 0
      - name: connectionToken
        description: 30-char `[a-z0-9]` session id (`sessionID` of every other route);
          "" on error.
      - name: connectionID
        description: |
          connection id of the session.
        value: 0
      - name: serverTime
        description: unix seconds (success) or RFC3339 string (error path).
      - name: accountInfo
        row: AccountInfoRow
        description: account block, null on error.
      - name: profiles
        row: GameProfileRow
        description: one row describing the logged-in user.
      - name: banLevel
        description: |
          ban level of the account (0 when it is not banned).
        value: 0
      - name: banSeconds
        description: |
          remaining seconds of the ban, 0 when there is none.
        value: 0
      - name: banMessage
        description: |
          ban message, null when the account is not banned.
      - name: extra
        description: 'A1 only (slot 9): `[]`; the other titles do not have this slot.'
        value: []
      - name: clientSettings
        row: ClientSettingsRow
        description: |
          the [key, value] list of client settings the service returns for the title.
      - name: selectProfile
        row: SelectProfileArray
        description: the per-profile block (its 9-11 slots depend on title and client
          library, see the row).
      - name: sslCertificates
        description: |
          `[]` — the captures carry no certificates.
        value: []
      - name: shouldUseClientSync
        description: |
          0, server-authoritative sync.
        value: 0
      - name: relayServers
        row: RelayServerRow
        description: |
          the relay servers of the account's region.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - platformUserID
              - alias
              properties:
                accountType:
                  type: string
                  enum:
                  - STEAM
                  - XBOXLIVE
                  description: XBOXLIVE selects the Xbox identity (account type 9,
                    `/xboxlive/...` path).
                platformUserID:
                  type: integer
                  format: int64
                  description: Steam id64 / Xbox id.
                alias:
                  type: string
                  description: display name.
                title:
                  type: string
                  description: e.g. age2/athens.
                macAddress:
                  type: string
                  description: network MAC address.
                clientLibVersion:
                  type: integer
                  description: drives the row shapes (190 sanitized alias, 193 trailing
                    -1, 194 "The Baltic Powers" formats).
            examples:
              lanRequest:
                summary: Example request
                value:
                  accountType: STEAM
                  platformUserID: 76561198000000001
                  alias: Player
                  title: age2
                  macAddress: 00:11:22:33:44:55
                  clientLibVersion: 193
      responses:
        '200':
          description: Positional login answer (or the 2-coded error array); sets
            the cookies `reliclink` (`Expires`/`Max-Age` 1h) and the headers `Request-Context`,
            `Cache-Control`, `Expires`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Positional'
              examples:
                sample:
                  summary: Example answer
                  value:
                  - 0
                  - 1
                  - 0
                  - 1764643200
                  - - 19375011
                    - /steam/76561198000000001
                    - 1
                    - -1
                    - 0
                    - en
                    - eur
                    - 1
                    - null
                  - - 1
                    - 19375011
                    - /steam/76561198000000001
                    - null
                    - Player
                    - Player
                    - []
                    - 4321
                    - 0
                    - 9999
                    - 1
                    - null
                    - value-platformUserID
                    - 1
                    - []
                  - 0
                  - 0
                  - 1
                  - []
                  - - value-slot
                    - value-slot
                  - - 1
                    - null
                    - null
                    - null
                    - null
                    - null
                    - []
                    - null
                    - 1
                    - null
                    - 1
                  - []
                  - 0
                  - - westeurope
                    - null
                    - 192.168.1.50
                    - 27012
                    - 27012
                    - 27012
  /game/login/logout:
    post:
      tags:
      - Game
      summary: Closes the session
      description: |
        Removes the session user from its lobby advertisement, cancels any matchmaking
        search, leaves every chat channel, sets
        presence 0, deletes the session and answers `[0]`. The friends receive
        `PresenceMessage` (presence 0).
      operationId: gameLogout
      x-games:
      - A1
      - A2
      - A3
      - A4
      - AoM
      x-response-positions:
      - name: resultCode
        description: 0 on success; 2 when the session's user cannot be resolved.
        value: 0
      security:
      - GameSession: []
      responses:
        '200':
          description: Positional JSON array; the slot order is in the operation's
            `x-response-positions`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Positional'
              examples:
                sample:
                  summary: Example answer
                  value:
                  - 0
        '401':
          $ref: '#/components/responses/Unauthorized'
  /game/login/readSession:
    post:
      tags:
      - Game
      summary: Polls the queued notification frames
      description: |
        The fall-back notification channel when the client has no live WebSocket:
        answers with every frame queued on the session (the same frames `/wss/`
        pushes, envelope `[0, <action>, <subjectUserId>, <payload>]`, message list as explained
        in the websocket API spec, long-polling up to 19 s; `ack` is the last
        message id the client processed and is echoed when nothing was queued. An
        absent or unparsable `ack` binds as 0. The message counter advances by one per
        frame of the answer, which is what the AoE I/AoE III (legacy) client expects.
      operationId: gameReadSession
      x-games:
      - A1
      - A2
      - A3
      - A4
      - AoM
      x-response-positions:
      - name: messageId
        description: 'the id of the batch: ack+1 when frames drain, else the ack echoed.'
      - name: messages
        description: list of queued frames — each `[0, action, subjectUserId, payload]`,
          up to 100 (the queue cap).
      security:
      - GameSession: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                ack:
                  type: integer
                  description: last processed message id.
            examples:
              lanRequest:
                summary: Example request
                value:
                  ack: 1
      responses:
        '200':
          description: Positional JSON array; the slot order is in the operation's
            `x-response-positions`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Positional'
              examples:
                sample:
                  summary: Example answer
                  value:
                  - 1
                  - 1
        '401':
          $ref: '#/components/responses/Unauthorized'
  /game/account/setLanguage:
    post:
      tags:
      - Game
      summary: |
        Sets the client language
      description: |
        Stores the client language in the account and answers `[0]`.
      operationId: gameSetLanguage
      x-games:
      - A1
      - A2
      - A3
      - A4
      - AoM
      x-response-positions:
      - name: resultCode
        description: |
