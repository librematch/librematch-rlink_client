  /game/account/setCrossplayEnabled:
    post:
      tags:
      - Game
      summary: Enables crossplay
      description: |
        Reads `crossplayEnabled` (the AoE1 client names it `enable`) from the body and
        answers `[0]` when it is `"1"`, `[2]` otherwise. Only the enable path appears
        in the captures.
      operationId: gameSetCrossplayEnabled
      x-games:
      - A1
      - A2
      - A3
      - A4
      - AoM
      x-response-positions:
      - name: resultCode
        description: |
          0 when crossplay was enabled, 2 otherwise.
        value: 0
      security:
      - GameSession: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                crossplayEnabled:
                  type: string
                  description: '1 to enable; the body is read, not the query string
                    (A1 fallback name: enable).'
            examples:
              lanRequest:
                summary: Example request
                value:
                  crossplayEnabled: example
      responses:
        '200':
          description: Positional JSON array; the slot order is in the operation's
