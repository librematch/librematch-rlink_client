  /game/automatch2/polling:
    post:
      tags:
      - Game
      summary: Enters and polls the matchmaking queue (POST)
      description: |
        Enters the caller (and the linked party, keyed by `partySessionID`) in the
        queues of `matchTypes` and answers the poll state. An empty `matchTypes` array
        removes the caller from the queue. When a pair appears, the reservation id is
        minted (slot 13's `matchID`) and the `Automatch2GameMessage` joiner frame is
        pushed to the peers by the lobby creation stage. A4 binds
        `previouslyGivenMatchId` to re-attach to a live match; the race and veto
        vectors are stored for the pairing.

        The unmatched body is a fixed 22-slot row of constants (A1 omits the third
        port slot — 20); the matched body (A2/A4/AoM; A1/A3 reuse the unmatched shape
        with the reservation id filled in) carries the host profile, the map, the
        queue and the battle server.
      operationId: gameAutomatchPollingPost
      x-games:
      - A1
      - A2
      - A3
      - A4
      - AoM
      x-response-positions:
      - name: resultCode
        description: 0 on success; 2 on a binding failure (the constants row follows).
        value: 0
      - name: queueStatus
        description: one ["<matchType>", searchingPlayersOrPosition, [[raceID, 1]],
          "0"] row per queue requested.
      - name: estimatedWaitMs
        description: |
          the estimated queue time in milliseconds.
        value: 0
      - name: extra
        description: |
          null.
      - name: assignedMatchID
        description: -1 (unmatched) or the host profile id (matched).
      - name: extra2
        description: the empty string when unmatched; the map name when matched.
      - name: extra3
        description: unmatched -1; matched 0.
      - name: extra4
        description: unmatched -1; matched 0.
      - name: extra5
        description: unmatched -1; matched the map id.
      - name: teamCount
        description: constant "0" unmatched; the teams string when matched.
      - name: teamSize
        description: constant "0" unmatched; the players string when matched.
      - name: queueID
        description: '''-1'' unmatched; the queue id string when matched.'
      - name: matchID
        description: the reservation id once a pair exists, else -1.
      - name: authtoken
        description: literal "authtoken".
        value: authtoken
      - name: battleIP
        description: '"0.0.0.0" unmatched; the battle server address when matched.'
      - name: ports
        description: three 0 slots unmatched; [bsPort, wsPort, oobPort] when matched
          — A1 stops at the second.
      - name: region
        description: 'the relay region (unmatched: 0).'
      - name: peers
        row: PeerRow
        description: the matched lobby peers; [] unmatched.
      - name: extra6
        description: empty when matched; see the age-specific tails.
      - name: completion
        description: the queue's MatchCompletionValue (e.g. 225 for the A2 queues,
          1 for A4, 0 otherwise).
      - name: tail
        description: the closing constants of the unmatched row ("", null, 0 — the
          A1 row ends one slot earlier).
      security:
      - GameSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                matchTypes:
                  type: string
                  description: 'JSON array of queue ids ([]: leave the queue): A1
                    [8]; A2 [22,23,24]...; A3 [2]/[3]/[4]; A4 [20..23],[860]; AoM
                    [28..39].'
                raceInfoRaceID:
                  type: string
                  description: >-
                    JSON array; the race per queue, echoed in the status rows.
                raceInfoKey:
                  type: string
                  description: JSON array; the veto index per queue (A4 semantics).
                factionIDs:
                  type: string
                  description: JSON array stored with the queue entry.
                vetoMapKey:
                  type: string
                  description: JSON array (A4 map veto keys).
                vetoMaps:
                  type: string
                  description: JSON array (A4 map vetoes).
                options:
                  type: string
                  description: JSON array, stored unused.
                partySessionID:
                  type: integer
                  format: int64
                  description: links the party members through their advertisement
                    rosters.
                relayRegion:
                  type: string
                  description: '"westeurope" or the LAN GUID; selects the battle server.'
                previouslyGivenMatchId:
                  type: integer
                  description: A4 re-attach to an existing reservation.
                notifiedAutomatchSuccess:
                  type: boolean
                  description: logged.
                raceInfoProfileID:
                  type: string
                  description: logged.
            examples:
              lanRequest:
                summary: Example request
                value:
                  matchTypes: '[8]'
                  raceInfoRaceID: example
                  raceInfoKey: example
                  factionIDs: example
                  vetoMapKey: example
                  vetoMaps: example
                  options: example
                  partySessionID: 1
                  relayRegion: westeurope
                  previouslyGivenMatchId: 1
                  notifiedAutomatchSuccess: true
                  raceInfoProfileID: example
      responses:
        '200':
          description: Positional JSON array; the slot order is in the operation's
            `x-response-positions`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Positional'
              examples:
                sample:
                  summary: Example answer
                  value:
                  - 0
                  - 1
                  - 0
                  - 1
                  - 88000001
                  - 1
                  - 1
                  - 1
                  - 1
                  - 1
                  - 1
                  - 1
                  - 88000001
                  - authtoken
                  - 1
                  - 27012
                  - 1
                  - - 1
                    - 19375011
                    - -1
                    - 4321
                    - 1
                    - 1
                    - /10.0.11.5
                  - 1
                  - 1
                  - 1
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
      - Game
      summary: Enters and polls the matchmaking queue (GET)
      description: The AoE1/AoE2/AoE3/AoM clients poll with a GET; the fields travel
        in the query string (the same binder). A4 has no GET form.
      operationId: gameAutomatchPollingGet
      x-games:
