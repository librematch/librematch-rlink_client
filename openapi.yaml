              - teamIDs
              properties:
                match_id:
                  type: integer
                  description: advertisement id.
                profile_ids:
                  type: string
                  description: JSON array of profile ids.
                race_ids:
                  type: string
                  description: JSON array of civilization ids (AoE2 sends -1, AoE3
                    0).
                teamIDs:
                  type: string
                  description: JSON array of team ids (same length as profile_ids).
