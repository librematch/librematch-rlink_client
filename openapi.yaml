          a state change of a started lobby keeps answering 0.
        value: 0
      security:
      - GameSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                advertisementid:
                  type: integer
                state:
                  type: integer
                  description: 1 = started.
            examples:
              lanRequest:
                summary: Example request
                value:
                  advertisementid: 44000001
                  state: 0
      responses:
        '200':
          description: Positional JSON array; the slot order is in the operation's
