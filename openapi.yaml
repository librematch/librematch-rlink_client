  /game/cloud/getTempCredentials:
    get:
      tags:
      - Game
      summary: Issues the SAS credential for a blob
      description: |
        Answers the time-limited credential the client appends as the `sig` query of
        its `/cloudfiles/` request. `key` is the full client-side URL path; a leading
        `/cloudfiles/` is trimmed for the lookup. The SAS query starts at `sig=`. An
        unknown key answers the failure array, whose expiry slot carries now+5
        minutes.
      operationId: gameCloudGetTempCredentials
      x-games:
      - A1
      - A2
      - A3
      - A4
      - AoM
      x-response-positions:
      - name: resultCode
        description: 0 for a known key (store enabled); 2 for an unknown key or a
          disabled store.
        value: 0
      - name: expiryUnix
        description: unix seconds of the credential expiry = now + 5 minutes; 0 when
          the store is disabled.
      - name: sasQuery
        description: the SAS query string `title=<game>&sig=<credential>&se=<RFC3339
          url-escaped>&sv=2019-02-02&sp=r&sr=b` (download scope; "" on failure).
      - name: key
        description: the echoed key.
      security:
      - GameSession: []
      parameters:
      - name: key
        in: query
        required: true
        schema:
          type: string
        description: the blob lookup — the `/cloudfiles/...` path of the client's
          URL.
