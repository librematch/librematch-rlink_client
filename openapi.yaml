              properties:
                advertisementid:
                  type: integer
                numericTagNames:
                  type: string
                  description: JSON array of names.
                numericTagValues:
                  type: string
                  description: JSON array of int32.
                stringTagNames:
                  type: string
                  description: JSON array of names.
                stringTagValues:
                  type: string
                  description: JSON array of strings.
            examples:
              lanRequest:
                summary: Example request
