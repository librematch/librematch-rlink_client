              - fromItemIDs
              - toItemIDs
              properties:
                charges:
                  type: string
                  description: JSON array of the charges moved per entry.
                deletes:
                  type: string
                  description: JSON array; non-zero deletes the source instance.
                fromItemIDs:
                  type: string
