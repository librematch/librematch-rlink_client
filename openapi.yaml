                value:
                  advertisementid: 44000001
                  appbinarychecksum: 0
                  datachecksum: 0
                  moddllfile: INVALID
                  moddllchecksum: 0
                  modname: ''
                  modversion: ''
                  versionFlags: 1
                  description: LAN lobby
                  automatchPoll_id: 1
                  relayRegion: westeurope
                  mapname: example
                  hostid: 1
                  isObservable: true
                  observerDelay: 30
                  observerPassword: ''
                  password: lan-password
                  passworded: false
                  visible: true
                  joinable: true
                  statgroup: 1
                  matchtype: 1
                  maxplayers: 8
                  options: example
                  slotinfo: example
                  psnSessionID: 1
                  state: 0
                  serviceType: 1
                  race: 1
                  team: 1
                  party: 1
      responses:
        '200':
          description: Positional JSON array; the slot order is in the operation's
            `x-response-positions`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Positional'
              examples:
                sample:
                  summary: Example answer
                  value:
                  - 0
                  - 44000001
                  - authtoken
                  - - 192.168.1.50
                    - 27012
                    - 27012
                    - 27012
                  - 1
                  - - 1
                    - 19375011
                    - -1
                    - 4321
                    - 1
                    - 1
                    - /10.0.11.5
                  - 0
                  - 1
        '401':
          $ref: '#/components/responses/Unauthorized'
  /game/advertisement/join:
    post:
      tags:
      - Game
      summary: Joins a lobby
      description: |
        Validates the optional lobby password and
        answers with the battle server and the joiner's own peer row. A mismatch of
        version/modChecksums, `joinable` = false, `party` not matching the lobby, a
        wrong password or an unknown advertisement refuses the join; a matchmaking
        join skips those checks (the lobby is server-managed).
      operationId: gameAdvertisementJoin
      x-games:
      - A1
      - A2
      - A3
      - A4
      - AoM
      x-response-positions:
      - name: resultCode
        description: 0 on success; 2 on any refusal (the rest of the array stays,
          with ""/0 defaults).
        value: 0
      - name: hostIP
        description: the lobby's synthetic "/10.0.11.N" address
      - name: resolvedIP
        description: |
          the battle server address of the relay region; empty for LAN lobbies.
      - name: battlePorts
        description: '[bsPort, wsPort, oobPort?] — the out-of-band slot only for A2/A3/A4/AoM.'
      - name: peer
        row: PeerRow
        description: one nested list containing the joiner's peer row.
      security:
      - GameSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - advertisementid
              properties:
                advertisementid:
                  type: integer
                appbinarychecksum:
                  type: integer
                  description: must match the lobby's.
                datachecksum:
                  type: integer
                moddllfile:
                  type: string
                moddllchecksum:
                  type: integer
                modname:
                  type: string
                modversion:
                  type: string
                versionFlags:
                  type: integer
                password:
                  type: string
                  description: required whenever the lobby has one and it is not a
                    matchmaking join.
                party:
                  type: integer
                  description: -1 or the lobby party; forced -1 on a matchmaking join.
                race:
                  type: integer
                team:
                  type: integer
                  description: forced -1 on a matchmaking join.
            examples:
              lanRequest:
                summary: Example request
                value:
                  advertisementid: 44000001
                  appbinarychecksum: 0
                  datachecksum: 0
                  moddllfile: INVALID
                  moddllchecksum: 0
                  modname: ''
                  modversion: ''
                  versionFlags: 1
                  password: lan-password
                  party: 1
                  race: 1
                  team: 1
      responses:
        '200':
          description: Positional JSON array; the slot order is in the operation's
            `x-response-positions`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Positional'
              examples:
                sample:
                  summary: Example answer
                  value:
                  - 0
                  - 1
                  - 1
                  - 27012
                  - - 1
                    - 19375011
                    - -1
                    - 4321
                    - 1
                    - 1
                    - /10.0.11.5
        '401':
          $ref: '#/components/responses/Unauthorized'
  /game/advertisement/update:
    post:
      tags:
      - Game
      summary: Updates a lobby
      description: |
        Updates the lobby from the form. When the advertised id is this user's
        matchmaking reservation and no lobby exists yet, the lobby is created here
        (server-supplied description, map, maxplayers and relay region; `joinable`
        true; the caller a peer) — the matchmaking host never calls `host`. While the
        lobby is a matchmaking reservation the server-supplied fields stay; a `state`
        of 1 stamps the start time and the state never moves back. A2/A4/AoM and AoE3
        from library 194 answer with the encoded advertisement as a second slot; A1
        and the old AoE3 library answer `[0]`.
      operationId: gameAdvertisementUpdate
      x-games:
      - A1
      - A2
      - A3
      - A4
      - AoM
      x-response-positions:
      - name: resultCode
        description: 0 on success; 2 on a binding failure or unknown advertisement
          ([2] on A1, [2,[]] on the others).
        value: 0
      - name: advertisement
        row: AdvertisementRow
        description: the full updated row (absent on A1 and AoE3 below library 194).
      security:
      - GameSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - advertisementid
              properties:
                advertisementid:
                  type: integer
                appbinarychecksum:
                  type: integer
                datachecksum:
                  type: integer
                moddllfile:
                  type: string
                moddllchecksum:
                  type: integer
                modname:
                  type: string
                modversion:
                  type: string
                versionFlags:
                  type: integer
                description:
                  type: string
                automatchPoll_id:
                  type: integer
                mapname:
                  type: string
                hostid:
                  type: integer
                  description: 0 = the session user.
                isObservable:
                  type: boolean
                observerDelay:
                  type: integer
                observerPassword:
                  type: string
                password:
                  type: string
                passworded:
                  type: boolean
                visible:
                  type: boolean
                joinable:
                  type: boolean
                  description: forced true for A1 and old AoE3 libraries.
                matchtype:
                  type: integer
                maxplayers:
                  type: integer
                options:
                  type: string
                slotinfo:
                  type: string
                psnSessionID:
                  type: integer
                  format: int64
                  description: also stored as the platform session id on A1/old AoE3.
                state:
                  type: integer
                  description: once 1, never back (the official behaviour).
            examples:
              lanRequest:
                summary: Example request
                value:
                  advertisementid: 44000001
                  appbinarychecksum: 0
                  datachecksum: 0
                  moddllfile: INVALID
                  moddllchecksum: 0
                  modname: ''
                  modversion: ''
                  versionFlags: 1
                  description: LAN lobby
                  automatchPoll_id: 1
                  mapname: example
                  hostid: 1
                  isObservable: true
                  observerDelay: 30
                  observerPassword: ''
                  password: lan-password
                  passworded: false
                  visible: true
                  joinable: true
                  matchtype: 1
                  maxplayers: 8
                  options: example
                  slotinfo: example
                  psnSessionID: 1
                  state: 0
      responses:
        '200':
          description: Positional JSON array; the slot order is in the operation's
            `x-response-positions`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Positional'
              examples:
                sample:
                  summary: Example answer
                  value:
                  - 0
                  - - 44000001
                    - 1
                    - null
                    - ''
                    - ''
                    - value-xboxSessionId
                    - 1
                    - 1
                    - value-next
                    - value-next
                    - 1
                    - value-next
                    - eNrtvV1z2zgWQEv...
                    - 1
                    - 0
                    - eNrtvV1z2zgWQEv...
                    - 1
                    - null
                    - 1
                    - 0
                    - 1
                    - 1764643200
                    - 1
                    - 1
                    - null
                    - westeurope
                    - null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /game/advertisement/updateTags:
    post:
      tags:
      - Game
      summary: Replaces the lobby tags
      description: |
        Host-only. Replaces the whole tag set, which findAdvertisements filters on
        (e.g. AoE IV input_kbm). The name and value arrays must have the same length.
        A request without tag fields clears the tag set.
      operationId: gameAdvertisementUpdateTags
      x-games:
      - A2
      - A4
      - AoM
      x-response-positions:
