  /game/advertisement/host:
    post:
      tags:
      - Game
      summary: Creates and hosts a lobby advertisement
      description: |
        Creates the lobby (`advertisementid` must be -1 for a fresh lobby), assigns
        its id and answers with the battle server of
        the relay region, the region, the current peers and the metadata. When
        `automatchPoll_id > 0` the lobby is the matchmaking host of a pending
        reservation and the other players are notified (`Automatch2GameMessage`); AoE1
        additionally attaches the queued peers server-side. `joinable` is true for A1
        and AoE3 below the Baltic Powers, AoE1 lobbies use one port pair less (no
        out-of-band slot) and no battle-server name in their advertisement rows. The
        AoE1/AoE3 clients send every field in the query string and repeat it in the
        body; only the body is bound.
      operationId: gameAdvertisementHost
      x-games:
      - A1
      - A2
      - A3
      - A4
      - AoM
      x-response-positions:
      - name: errorCode
        description: |
          0 on success; 2 when the request is refused (binding failure, bad checksum
          description, unknown relay region, an id that is not -1 without a reservation,
          or an unknown host). On error: advertisementId 0 and peers [].
        value: 0
      - name: advertisementId
        description: |
          the assigned lobby id; 0 on error.
      - name: authtoken
        description: literal string "authtoken" (official value).
        value: authtoken
      - name: battleServer
        row: BattleServerAddress
        description: |
          the battle server block: [IPv4, bsPort, wsPort, oobPort?] — the oob slot only
          for A2/A3/A4/AoM.
      - name: relayRegion
        description: the region echoed (a normal region, or the LAN GUID for LAN lobbies).
      - name: peers
        row: PeerRow
        description: the peers.
      - name: zero
        description: |
          constant 0 slot of the response (A1 stops here after the peers).
        value: 0
      - name: tail
        description: 'A1 (slots 10): metadata — `0` for a LAN lobby or the Xbox session JSON for a WAN host; A2/A4/AoM and AoE3 >= 194 (slots 10-14): 0, null, null, metadata, description; AoE3 below 194 (slot 10): metadata string "0".'
      security:
      - GameSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - advertisementid
              - description
              properties:
                advertisementid:
                  type: integer
                  description: -1 to create.
                appbinarychecksum:
                  type: integer
                  description: version checksum, matched at join.
                datachecksum:
                  type: integer
                moddllfile:
                  type: string
                  description: '"INVALID" without mods.'
                moddllchecksum:
                  type: integer
                modname:
                  type: string
                modversion:
                  type: string
                versionFlags:
                  type: integer
                description:
                  type: string
                  description: lobby title; "AUTOMATCH"/"SESSION_MATCH_KEY" mark matchmaking
                    and session lobbies.
                automatchPoll_id:
                  type: integer
                  description: '>0: this is the host lobby of a matchmaking reservation.'
                relayRegion:
                  type: string
                  description: region name or the LAN battle-server GUID (read from
                    the body).
                mapname:
                  type: string
                hostid:
                  type: integer
                  description: 0 = the session user.
                isObservable:
                  type: boolean
                observerDelay:
                  type: integer
                observerPassword:
                  type: string
                password:
                  type: string
                  description: matched verbatim at join; never echoed.
                passworded:
                  type: boolean
                visible:
                  type: boolean
                joinable:
                  type: boolean
                  description: forced true for A1 and old AoE3 libraries.
                statgroup:
                  type: integer
                  description: accepted but unused.
                matchtype:
                  type: integer
                maxplayers:
                  type: integer
                options:
                  type: string
                  description: opaque base64+zlib block, stored and echoed.
                slotinfo:
                  type: string
                  description: opaque base64+zlib block.
                psnSessionID:
                  type: integer
                  format: int64
                  description: empty string tolerated.
                state:
                  type: integer
                  description: usually -1 at creation.
                serviceType:
                  type: integer
                  description: 0 online; 1 marks a LAN lobby.
                race:
                  type: integer
                team:
                  type: integer
                party:
                  type: integer
                  description: -1 none, else the parent lobby id (it must exist and
                    be a party root).
