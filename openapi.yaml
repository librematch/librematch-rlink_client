        unknown name is skipped.
      operationId: gameGetClan
      x-games:
      - A1
      - A2
      - A3
      - A4
      - AoM
      x-response-positions:
      - name: resultCode
        value: 0
      - name: clans
        row: ClanRow
        description: one row per clan.
      security:
      - GameSession: []
      parameters:
      - name: names
        in: query
        required: true
        schema:
          type: string
        description: JSON array of the clan names.
      responses:
        '200':
          description: Positional JSON array; the slot order is in the operation's
            `x-response-positions`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Positional'
              examples:
                sample:
                  summary: Answer of the official service
                  value:
                  - 0
                  - []
        '401':
          $ref: '#/components/responses/Unauthorized'
  /game/clan/getClanInfoFull:
    get:
      tags:
      - Game
      summary: Full clan record
      description: |
        The full record of the clan `name`: the `ClanRow` of the clan followed by
        its role permission rows (`[[rank, 9 permissions, role name,
        locstringID], ...]`) and its member rows (`[[profile row,
        membershipStatus, playerlistPermissionRank], ...]`; the rank is `-1`
        without one).
      operationId: gameGetClanInfoFull
      x-games:
      - A1
      - A2
      - A3
      - A4
      - AoM
      x-response-positions:
      - name: resultCode
        value: 0
      - name: clan
        description: the `ClanRow` of the clan with its role and member blocks.
      security:
      - GameSession: []
      parameters:
      - name: name
        in: query
        required: true
        schema:
          type: string
        description: the clan name.
      responses:
        '200':
          description: Positional JSON array; the slot order is in the operation's
            `x-response-positions`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Positional'
              examples:
                sample:
                  summary: Example answer
                  value:
                  - 0
                  - []
        '401':
          $ref: '#/components/responses/Unauthorized'
  /game/clan/update:
    post:
      tags:
      - Game
      summary: Updates a clan
      description: |
        Updates the clan `clanList_id` with the fields of the request.
      operationId: gameUpdateClan
      x-games:
      - A1
      - A2
      - A3
      - A4
      - AoM
      x-response-positions:
      - name: resultCode
        value: 0
      security:
      - GameSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - clanList_id
              properties:
                clanList_id:
                  type: integer
                  description: the clan.
                description:
                  type: string
                  description: the public description.
                icon:
                  type: string
                  description: the crest id (e.g. CR-001).
                joinPolicy:
                  type: integer
                  description: the join policy (0 open, 1 invite/request only).
                messageOfTheDay:
                  type: string
                  description: the message shown to the members.
                metadata:
                  type: string
                  description: the clan metadata.
                tags:
                  type: string
                  description: JSON array of the clan tags.
      responses:
        '200':
          description: Positional JSON array; the slot order is in the operation's
            `x-response-positions`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Positional'
              examples:
                sample:
                  summary: Documented result code
                  value:
                  - 0
        '401':
          $ref: '#/components/responses/Unauthorized'
  /game/clan/find:
    get:
      tags:
      - Game
      summary: |
        Searches clans
      description: |
        Pages the clans of the title as `ClanRow` rows, filtered by `name`,
        `joinPolicies` and `tags`, with `count`/`start` paging. No match answers `[0,
        []]`.
      operationId: gameFindClans
      x-games:
      - A1
      - A2
      - A3
      - A4
      - AoM
      x-response-positions:
      - name: resultCode
        value: 0
      - name: clans
        row: ClanRow
        description: one row per clan of the page.
      security:
      - GameSession: []
      parameters:
      - name: count
        in: query
        required: false
        schema:
          type: integer
        description: page size.
      - name: start
        in: query
        required: false
        schema:
          type: integer
        description: index of the first row of the page.
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: substring of the clan name; empty lists every clan.
      - name: joinPolicies
        in: query
        required: false
        schema:
          type: string
        description: |
          JSON array of the join policies to include ([0,1,2] includes them all).
      - name: tags
        in: query
        required: false
        schema:
          type: string
        description: JSON array of the clan tags to filter by; [] includes them all.
      responses:
        '200':
          description: Positional JSON array; the slot order is in the operation's
            `x-response-positions`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Positional'
              examples:
                sample:
                  summary: Example answer
                  value:
                  - 0
                  - []
        '401':
          $ref: '#/components/responses/Unauthorized'
  /game/clan/create:
    post:
      tags:
      - Game
      summary: Creates a clan
      description: |
        Creates the clan of the caller with the requested name, tag and metadata.
        The documented trace answers `[3, null, null, []]`: the creation was refused
        and no clan came back.
      operationId: gameCreateClan
      x-games:
      - A1
      - A2
      - A3
      - A4
      - AoM
      x-response-positions:
      - name: resultCode
        description: 0 on success; 3 in the documented trace (creation refused).
      - name: clan
        description: the created clan; null when the creation fails.
      - name: member
        description: the caller as member; null when the creation fails.
      - name: members
        description: the member rows of the new clan; [] when it fails.
      security:
      - GameSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - name
              - fullName
              properties:
                name:
                  type: string
                  description: the clan tag.
                fullName:
                  type: string
                  description: the full name of the clan.
                description:
                  type: string
                  description: the public description.
                icon:
                  type: string
                  description: the crest id (e.g. CR-001).
                joinPolicy:
                  type: integer
                  description: the join policy (0 open, 1 invite/request only).
                metadata:
                  type: string
                  description: the clan metadata.
                messageOfTheDay:
                  type: string
                  description: the message shown to the members.
                tags:
                  type: string
                  description: JSON array of the clan tags.
                cost:
                  type: integer
                  description: cost of the creation (0).
                itemPrice_id:
                  type: integer
                  description: the item paid for the creation (-1 none).
                paymentitem:
                  type: integer
                  description: the payment item (-1 none).
                chat:
                  type: string
                  description: JSON array of role permissions; [] in the trace.
                invite:
                  type: string
                  description: JSON array of role permissions; [] in the trace.
                promote:
                  type: string
                  description: JSON array of role permissions; [] in the trace.
                demote:
                  type: string
                  description: JSON array of role permissions; [] in the trace.
                remove:
                  type: string
                  description: JSON array of role permissions; [] in the trace.
                disband:
                  type: string
                  description: JSON array of role permissions; [] in the trace.
                editInfo:
                  type: string
                  description: JSON array of role permissions; [] in the trace.
                editPermission:
                  type: string
                  description: JSON array of role permissions; [] in the trace.
                rank:
                  type: string
                  description: JSON array of the role ranks; [] in the trace.
                permissionName:
                  type: string
                  description: JSON array of the role names; [] in the trace.
                locStringID:
                  type: string
                  description: JSON array of the role locstring ids; [] in the trace.
      responses:
        '200':
          description: Positional JSON array; the slot order is in the operation's
            `x-response-positions`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Positional'
              examples:
                sample:
                  summary: Documented answer
                  value:
                  - 3
                  - null
                  - null
                  - []
        '401':
          $ref: '#/components/responses/Unauthorized'
  /community/news/getNews:
