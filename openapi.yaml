                    type: array
                    items:
                      $ref: '#/components/schemas/CommunityProfile'
  /community/external/proxysteamuserrequest:
    get:
      tags:
      - Community
      summary: Profiles and the Steam summary
      description: |
        `avatars` carries the resolved profiles and `steamResults` the player
        summaries of the Steam Web API. `request` is the Steam API path the request is
        proxied to (evidently `ISteamUser/GetPlayerSummaries`).
      operationId: communityProxySteamUserRequest
      security: []
      parameters:
      - $ref: '#/components/parameters/CommunityTitle'
      - name: profile_names
        in: query
        required: false
        schema:
          type: string
        description: JSON array of `/steam/<id>` (also profileNames).
      - name: profileNames
        in: query
        required: false
        schema:
          type: string
      - name: aliases
        in: query
        required: false
        schema:
          type: string
      - name: request
        in: query
        required: false
        schema:
          type: string
        description: |
          the Steam Web API path the request is proxied to.
      responses:
        '200':
          description: Profiles plus an empty Steam summary.
          content:
            application/json:
              schema:
                type: object
                required:
                - result
                - avatars
                - steamResults
                properties:
                  result:
                    $ref: '#/components/schemas/CommunityResult'
                  avatars:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommunityProfile'
                  steamResults:
                    $ref: '#/components/schemas/SteamResponse'
  /community/item/getInventoryByProfileIDs:
    get:
      tags:
      - Community
      summary: |
        Inventories by profile
      description: |
        One map per requested profile id, its key wrapped in literal double quotes
        (the live-service quirk), listing the items the profile owns.
      operationId: communityGetInventoryByProfileIDs
      security: []
      parameters:
      - $ref: '#/components/parameters/CommunityTitle'
      - name: profileids
        in: query
        required: false
        schema:
          type: string
        description: JSON array of profile ids (the name/alias forms are bound but
          dropped).
      - name: profile_ids
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Empty inventories.
          content:
            application/json:
              schema:
                type: object
                required:
                - result
                - itemInstancesByProfileID
                properties:
                  result:
                    $ref: '#/components/schemas/CommunityResult'
                  itemInstancesByProfileID:
                    type: array
                    items:
                      type: object
                      additionalProperties:
                        type: array
                        items: {}
